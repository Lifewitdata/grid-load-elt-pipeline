services:
  postgres:
    image: postgres:16-alpine
    container_name: grid-pg
    environment:
      POSTGRES_USER: grid_etl
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: grid_analytics
    ports:
      - "5433:5432"
    volumes:
      - grid_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid_etl -d grid_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  grid_pg_data:
